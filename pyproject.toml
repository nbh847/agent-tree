[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tree"
version = "0.1.0"
description = "tmux Agent 会话侧栏"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["textual>=8.0"]

[project.scripts]
agent-tree = "agent_tree.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]